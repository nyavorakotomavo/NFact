name: Facture IA manuelle

on:
  workflow_dispatch:
    inputs:
      seller_infos:
        description: "Infos du vendeur"
        required: true
        type: string

      client_infos:
        description: "Message du client"
        required: true
        type: string

      style:
        description: "Style visuel du PDF"
        required: true
        type: choice
        options:
          - stripe
          - quickbooks
          - freshbooks_simple
          - freshbooks_modern
          - wave
          - square
          - canva_minimal
          - canva_geometric
          - classique
          - creatif
        default: freshbooks_modern

      couleur_accent:
        description: "Couleur principale"
        required: false
        default: "#00A8E1"
        type: string

      taille_papier:
        description: "Format du papier"
        required: true
        type: choice
        options:
          - A4
          - LETTER
          - A5
        default: A4

      logo:
        description: "URL du logo du vendeur (optionnel)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  generer_facture:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install reportlab requests

      - name: Créer les dossiers
        run: mkdir -p out config

      - name: Créer le fichier IA depuis le secret
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          cat > config/ia.json <<IAEOF
          {
            "api_key": "${MISTRAL_API_KEY}",
            "api_url": "https://api.mistral.ai/v1/chat/completions",
            "model": "mistral-small-latest"
          }
          IAEOF

      - name: Télécharger le logo si URL
        if: ${{ inputs.logo != '' }}
        run: |
          mkdir -p logos
          curl -sL "${{ inputs.logo }}" -o logos/logo_download.png
          echo "LOGO_PATH=logos/logo_download.png" >> "$GITHUB_ENV"

      - name: Extraire vendeur + client avec IA
        env:
          SELLER_INFOS: ${{ inputs.seller_infos }}
          CLIENT_INFOS: ${{ inputs.client_infos }}
          STYLE: ${{ inputs.style }}
          COULEUR_ACCENT: ${{ inputs.couleur_accent }}
          TAILLE_PAPIER: ${{ inputs.taille_papier }}
          LOGO_PATH: ${{ env.LOGO_PATH }}
        run: python scripts/ai_to_json.py

      - name: Générer le PDF
        run: python NFact.py --config invoice.json --output-dir out

      - name: Validation avant envoi
        run: python scripts/validate.py invoice.json

      - name: Obtenir le nom du PDF
        id: pdf
        run: |
          PDF_FILE=$(ls out/*.pdf | head -n1)
          PDF_NAME=$(basename "$PDF_FILE")
          echo "pdf_path=$PDF_FILE" >> "$GITHUB_OUTPUT"
          echo "pdf_name=$PDF_NAME" >> "$GITHUB_OUTPUT"

      - name: Créer une release avec le PDF
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: facture-${{ github.run_number }}
          name: "Facture ${{ github.run_number }}"
          body: |
            📄 **Fichier** : ${{ steps.pdf.outputs.pdf_name }}
            
            Cliquez sur le fichier ci-dessous pour le télécharger.
          files: ${{ steps.pdf.outputs.pdf_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Afficher le lien
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════╗"
          echo "║  ✅ PDF GÉNÉRÉ                                      ║"
          echo "║  📎 ${{ steps.release.outputs.url }}"
          echo "╚══════════════════════════════════════════════════════╝"
