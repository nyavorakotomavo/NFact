name: Facture IA manuelle

on:
  workflow_dispatch:
    inputs:
      seller_infos:
        description: "Infos du vendeur"
        required: true
        type: string
      client_infos:
        description: "Message du client"
        required: true
        type: string
      style:
        description: "Style visuel du PDF (laisse vide pour voir la liste disponible)"
        required: false
        type: string
      couleur_accent:
        description: "Couleur(s) principale(s) — une seule (#7C3AED) ou plusieurs séparées par virgules (#7C3AED,#9333EA,#A78BFA) pour un dégradé"
        required: false
        type: string
      taille_papier:
        description: "Format du papier"
        required: true
        type: choice
        options:
          - A4
          - LETTER
          - A5
        default: A4
      logo_url:
        description: "URL du logo du vendeur (optionnel)"
        required: false
        type: string
      payment_amount:
        description: "Montant déjà payé (optionnel, pour vérification)"
        required: false
        type: string

jobs:
  generer-facture:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: |
          pip install reportlab requests

      - name: Télécharger le logo (si fourni)
        if: ${{ inputs.logo_url != '' }}
        run: |
          mkdir -p logos/tmp
          curl -L -o logos/tmp/logo_vendeur.png "${{ inputs.logo_url }}"
      - name: Debug - contenu réel des fichiers styles
        run: |
          echo "=== Arborescence styles/ ==="
          ls -la styles/
          echo ""
          for f in styles/*.py; do
            echo "=== $f ==="
            cat -A "$f" | head -5
            echo "--- (fin aperçu, taille totale: $(wc -l < "$f") lignes) ---"
            echo ""
          done
      - name: Extraction IA → invoice.json
        env:
          SELLER_INFOS: ${{ inputs.seller_infos }}
          CLIENT_INFOS: ${{ inputs.client_infos }}
          STYLE: ${{ inputs.style }}
          COULEUR_ACCENT: ${{ inputs.couleur_accent }}
          TAILLE_PAPIER: ${{ inputs.taille_papier }}
          LOGO_PATH: ${{ inputs.logo_url != '' && 'logos/tmp/logo_vendeur.png' || '' }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          python scripts/ai_to_json.py

      - name: Génération du PDF
        run: |
          python NFact.py --config invoice.json --output-dir out

      - name: Validation avant envoi
        env:
          PAYMENT_AMOUNT: ${{ inputs.payment_amount }}
        run: python scripts/validate.py invoice.json

      - name: Upload de la facture générée
        uses: actions/upload-artifact@v4
        with:
          name: facture-pdf
          path: out/*.pdf
          retention-days: 30