name: Facture IA manuelle

on:
  workflow_dispatch:
    inputs:
      client_name:
        description: "Nom du client (pour le titre de la release)"
        required: true
        type: string

      client_infos:
        description: "Message brut du client (coller ici)"
        required: true
        type: string

      style:
        description: "Style visuel du PDF"
        required: true
        type: choice
        options:
          - stripe
          - quickbooks
          - freshbooks_simple
          - freshbooks_modern
          - wave
          - square
          - canva_minimal
          - canva_geometric
          - classique
          - creatif
        default: stripe

      couleur_accent:
        description: "Couleur principale (ex: #2E5CFF)"
        required: false
        default: "#2E5CFF"
        type: string

      taille_papier:
        description: "Format du papier"
        required: true
        type: choice
        options:
          - A4
          - LETTER
          - A5
        default: A4

      logo:
        description: "Nom du fichier logo dans logos/ (ex: logo.png) ou URL"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  generer_facture:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install reportlab requests

      - name: Créer le dossier de sortie
        run: mkdir -p out

      - name: Télécharger le logo si URL
        if: ${{ inputs.logo != '' && startsWith(inputs.logo, 'http') }}
        run: |
          mkdir -p logos
          curl -sL "${{ inputs.logo }}" -o logos/logo_download.png
          echo "LOGO_PATH=logos/logo_download.png" >> "$GITHUB_ENV"

      - name: Utiliser le logo du repo
        if: ${{ inputs.logo != '' && !startsWith(inputs.logo, 'http') }}
        run: |
          if [ -f "logos/${{ inputs.logo }}" ]; then
            echo "LOGO_PATH=logos/${{ inputs.logo }}" >> "$GITHUB_ENV"
          else
            echo "LOGO_PATH=" >> "$GITHUB_ENV"
          fi

      - name: Pas de logo
        if: ${{ inputs.logo == '' }}
        run: echo "LOGO_PATH=" >> "$GITHUB_ENV"

      - name: Transformer les infos client en JSON avec IA
        env:
          CLIENT_INFOS: ${{ inputs.client_infos }}
          STYLE: ${{ inputs.style }}
          COULEUR_ACCENT: ${{ inputs.couleur_accent }}
          TAILLE_PAPIER: ${{ inputs.taille_papier }}
          LOGO_PATH: ${{ env.LOGO_PATH }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_URL: ${{ secrets.AI_API_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
        run: python scripts/ai_to_json.py

      - name: Générer le PDF
        run: python NFact.py --config invoice.json --output-dir out

      - name: Validation avant envoi
        run: python scripts/validate.py invoice.json

      - name: Obtenir le nom du PDF
        id: pdf
        run: |
          PDF_FILE=$(ls out/*.pdf | head -n1)
          PDF_NAME=$(basename "$PDF_FILE")
          echo "pdf_path=$PDF_FILE" >> "$GITHUB_OUTPUT"
          echo "pdf_name=$PDF_NAME" >> "$GITHUB_OUTPUT"

      - name: Créer une release avec le PDF
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: facture-${{ github.run_number }}
          name: "Facture ${{ inputs.client_name }} - ${{ steps.pdf.outputs.pdf_name }}"
          body: |
            ## 📄 Document généré
            
            **Client** : ${{ inputs.client_name }}
            **Date** : ${{ github.run_id }}
            **Style** : ${{ inputs.style }}
            
            Cliquez sur le fichier ci-dessous pour le télécharger.
          files: ${{ steps.pdf.outputs.pdf_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Afficher le lien de téléchargement
        run: |
          echo ""
          echo "╔════════════════════════════════════════════════════════╗"
          echo "║  ✅ PDF GÉNÉRÉ AVEC SUCCÈS                            ║"
          echo "╠════════════════════════════════════════════════════════╣"
          echo "║                                                        ║"
          echo "║  📎 LIEN DE TÉLÉCHARGEMENT :                           ║"
          echo "║  ${{ steps.release.outputs.url }}"
          echo "║                                                        ║"
          echo "║  📄 Fichier : ${{ steps.pdf.outputs.pdf_name }}"
          echo "║                                                        ║"
          echo "╚════════════════════════════════════════════════════════╝"
          echo ""
          echo "👉 Copie ce lien et envoie-le à ton client par WhatsApp/SMS/email"
          echo ""
