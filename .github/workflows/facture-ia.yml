name: Facture IA manuelle

on:
  workflow_dispatch:
    inputs:
      email_to:
        description: "Email du client"
        required: true
        type: string

      client_infos:
        description: "Infos client. Ex: Nom: X; Adresse: Y; Articles: A x1 à 1000; TVA: 20"
        required: true
        type: string

      payment_amount:
        description: "Montant payé (optionnel)"
        required: false
        type: string

      dry_run:
        description: "Mode test (génère mais n'envoie pas)"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  generer_facture:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: |
          pip install reportlab requests

      - name: Créer le dossier de sortie
        run: mkdir -p out

      - name: Transformer les infos client en JSON avec IA
        env:
          CLIENT_INFOS: ${{ inputs.client_infos }}
          EMAIL_TO: ${{ inputs.email_to }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_URL: ${{ secrets.AI_API_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
        run: python scripts/ai_to_json.py

      - name: Générer le PDF
        run: python NFact.py --config invoice.json --output-dir out

      - name: Validation avant envoi
        env:
          PAYMENT_AMOUNT: ${{ inputs.payment_amount }}
        run: python scripts/validate.py invoice.json

      - name: Envoyer le PDF par email
        if: ${{ !inputs.dry_run }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp-mail.outlook.com
          server_port: 587
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: Votre facture / devis
          to: ${{ inputs.email_to }}
          from: ${{ secrets.EMAIL_USER }}
          body: |
            Bonjour,

            Veuillez trouver votre document en pièce jointe.

            Merci de votre confiance.
          attachments: out/

      - name: Sauvegarder le PDF
        uses: actions/upload-artifact@v4
        with:
          name: facture-pdf
          path: out/*.pdf
