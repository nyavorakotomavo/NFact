name: Sync styles disponibles

on:
  push:
    paths:
      - "styles/*.py"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install reportlab

      - name: Régénérer la liste des styles dans le workflow
        run: python scripts/sync_style_choices.py

      - name: Commit automatique si changement
        run: |
          if git diff --quiet -- .github/workflows/facture-ia.yml; then
            echo "Aucun changement de style détecté."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .github/workflows/facture-ia.yml
            git commit -m "🤖 Mise à jour automatique des styles disponibles"
            git push origin HEAD:${{ github.ref_name }}
          fi